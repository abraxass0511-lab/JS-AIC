<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>최종 점검장표 5가지 요구사항 미리보기 검증</title>
  <style>
    body {
      background: #f1f5f9;
      margin: 0;
      padding: 30px;
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .preview-container {
      width: 1200px;
      max-width: 95vw;
      background: #ffffff;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      color: #1e293b;
      font-size: 1.2rem;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="preview-container">
    <h2>🖥️ 실시간 미리보기: 2개 사진 배치 (모든 5개 요구사항 반영 완료)</h2>
    <div id="previewSlot"></div>
  </div>

  <script type="module">
    import '../app/js/ppt-generator.js';
    const SafePPT = window.SafePPT;

    const sampleRecord = {
      content: '말비계 설치범위가 모서리 구간에서 그쳐, 단부 추락위험',
      subcontractor: 'D사',
      workGroup: '조적',
      location: '105동 지하2층',
      inspector: '관리자',
      inspectRound: "'26년 下 3차",
      type: '추락',
      severity: '중부적합',
      mgmtCauses: ['계획 미이행', '불안전 상태'],
      interviewOpinion: '거푸집 제작장에서 양중로프를 걸 때 같은 간격으로 맞추지 못했다. 양중로프를 걸 수 있는 위치가 어느 정도 적당하다고 생각되는 곳에 로프를 걸었다.',
      auditProposal: '양중작업 시 양중화물의 수평양중은 낙하사고를 방지하는 중요한 안전작업방법이다. 지상에서 양중로프를 체결할 때 화물의 여장간격이 동일하도록 작업팀 교육 및 이행강화 노력이 필요함.'
    };

    const html = SafePPT.renderInspectionSheetHTML(sampleRecord, {
      photo1Url: '../app/samples/horizontal_photo1.jpg',
      photo2Url: '../app/samples/horizontal_photo2.jpg'
    });

    document.getElementById('previewSlot').innerHTML = html;
  </script>
</body>
</html>
